appId: com.adobe.aem.desktop
productName: AEM Desktop
copyright: Copyright 2026 Adobe. All rights reserved.

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - '!**/*.test.js'
  - '!test/**/*'

# Auto-update + release hosting. electron-updater reads latest-mac.yml from
# the matching GitHub release at runtime to discover and download updates.
publish:
  provider: github
  owner: adobe
  repo: aem-desktop

mac:
  category: public.app-category.developer-tools
  # Space-free artifact name. productName ("AEM Desktop") has a space, and
  # GitHub rewrites spaces in uploaded asset names (-> dots), which then no
  # longer match the URLs in latest-mac.yml and breaks auto-update with a 404.
  artifactName: AEM-Desktop-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization uses APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID.
  notarize: true
  target:
    # DMG is the user-facing installer; ZIP is required by electron-updater
    # for delta/auto updates on macOS. Apple Silicon only (Intel Macs are EOL).
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  # Same space-free artifact name rationale as mac (GitHub rewrites spaces in
  # uploaded asset names, which would break the latest.yml URLs auto-update reads).
  artifactName: AEM-Desktop-${version}-${arch}.${ext}
  # The Windows .ico is generated from build/icon.png (1024x1024) at build time.
  # Windows code signing is not configured yet: builds are unsigned until a
  # code-signing certificate and WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets
  # are added, so SmartScreen will warn on first launch.
  target:
    # NSIS is the user-facing installer and produces the latest.yml feed that
    # electron-updater reads on Windows. x64 only for now (Windows-on-ARM is
    # niche; add an arm64 entry here to also ship it).
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
