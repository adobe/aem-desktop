name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Lint + test, and compute the next version once so the platform build jobs
  #    can stamp their artifacts with it (electron-builder -c.extraMetadata.version).
  #    Uses a semantic-release dry-run against the same commit the publish job
  #    later releases, so the version is deterministic across jobs.
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sr.outputs.version }}
      publish: ${{ steps.sr.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Compute next version (semantic-release dry-run)
        id: sr
        env:
          # The admin PAT (not the default token) so the github plugin's
          # verifyConditions permission check passes; the dry-run never pushes.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run 2>&1 | tee sr.log || true
          if grep -qE 'The next release version is' sr.log; then
            VERSION=$(grep -oE 'The next release version is [0-9]+\.[0-9]+\.[0-9]+' sr.log \
              | tail -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Next release version: $VERSION"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes; nothing to release."
          fi

  # 2a) macOS: build, sign, notarize. Uploads the artifacts for the publish job.
  build-mac:
    name: Build macOS (signed + notarized)
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      # Import the Developer ID certificate ourselves instead of handing
      # electron-builder CSC_LINK. Its own CSC_LINK path builds a temporary
      # keychain and then calls `security set-key-partition-list` with the .p12
      # import password instead of the keychain password it generated
      # (electron-userland/electron-builder#10066), which the macos-26 runner
      # image has rejected since 20260907:
      #   security: SecKeychainUnlock: The user name or passphrase you entered
      #   is not correct.
      # Doing it here keeps the two passwords straight: the .p12 password is
      # only ever passed to `security import`, and the partition list is
      # unlocked with the keychain password.
      - name: Import signing certificate into a dedicated keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: notarization can outlast the default 5-minute timeout.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          # -k takes the KEYCHAIN password. This is the exact call that fails
          # inside electron-builder; here it gets the right secret.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Put it on the search list so codesign/notarytool can see it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: electron-builder (mac, signed + notarized)
        env:
          # No CSC_LINK: the certificate is already in CSC_KEYCHAIN (exported to
          # GITHUB_ENV by the step above), and electron-builder auto-discovers
          # the Developer ID Application identity from it.
          # Notarization credentials (Apple ID app-specific password flow).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npx electron-builder --mac --publish never
          -c.extraMetadata.version=${{ needs.version.outputs.version }}

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-mac
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  # 2b) Windows: build the NSIS installer. Unsigned for now (see note); still
  #     produces latest.yml so electron-updater auto-update works on Windows.
  build-win:
    name: Build Windows (unsigned)
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: electron-builder (win, unsigned)
        # Run under bash (Git Bash) so the `-c.extraMetadata.version=<v>` arg is
        # parsed exactly like the macOS job. The Windows runner's default shell
        # is PowerShell, which splits that token and makes electron-builder treat
        # ".extraMetadata.version=<v>" as a config file path (ENOENT).
        shell: bash
        # Windows code signing is not configured yet. Add a code-signing cert as
        # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets (and reference them here) to
        # sign; until then SmartScreen warns on first launch. Disabling auto
        # identity discovery keeps electron-builder from erroring on no cert.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          npx electron-builder --win --publish never
          -c.extraMetadata.version=${{ needs.version.outputs.version }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  # 3) Publish: recompute the (identical) version, update changelog/package.json,
  #    create the GitHub release, and attach the prebuilt mac + win artifacts.
  #    SEMANTIC_RELEASE_SKIP_BUILD=true makes the exec step skip rebuilding.
  release:
    name: Publish release
    needs: [version, build-mac, build-win]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-mac
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-win
          path: dist

      - name: Release (semantic-release attaches prebuilt artifacts)
        env:
          # Admin-owned PAT, NOT the default GITHUB_TOKEN. The `main-protection`
          # ruleset requires the "Test" status check on every push to main, and
          # the github-actions[bot] is not a bypass actor — so the bot's push of
          # the `chore(release)` commit is rejected with GH013. The bypass list
          # already allows the Repository admin role, so a PAT owned by a repo
          # admin pushes the release commit/tag through. `[skip ci]` in the commit
          # message keeps this PAT push from triggering a recursive workflow run.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Attach the mac + win artifacts downloaded above instead of rebuilding.
          SEMANTIC_RELEASE_SKIP_BUILD: 'true'
        run: npx semantic-release
